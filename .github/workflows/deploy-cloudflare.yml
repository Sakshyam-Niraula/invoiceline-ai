name: Deploy InvoiceLine AI to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: invoiceline-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Deploy API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/pyproject.toml

      - name: Install Python dependencies
        run: uv sync --no-install-project

      - name: Run backend test suite
        run: uv run pytest -q

      - name: Deploy API Worker
        run: uv run pywrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a90021b93a5357cad1c01079f4a8cf1b

      - name: Configure API secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a90021b93a5357cad1c01079f4a8cf1b
          APP_SECRET: ${{ secrets.APP_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$APP_SECRET" | uv run pywrangler secret put APP_SECRET --env production
          printf '%s' "$GEMINI_API_KEY" | uv run pywrangler secret put GEMINI_API_KEY --env production
          printf '%s' "$SUPABASE_SECRET_KEY" | uv run pywrangler secret put SUPABASE_SECRET_KEY --env production

  deploy-frontend:
    name: Deploy website
    runs-on: ubuntu-latest
    needs: deploy-backend
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check frontend
        run: npm run typecheck

      - name: Build production Worker
        run: npm run build
        env:
          CLOUDFLARE_ENV: production
          VITE_API_URL: https://invoiceline-api-prod.sakshyamniraula2.workers.dev

      - name: Deploy website Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a90021b93a5357cad1c01079f4a8cf1b
          CLOUDFLARE_ENV: production
