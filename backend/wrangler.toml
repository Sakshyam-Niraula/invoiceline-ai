name = "invoiceline-api"
main = "worker.py"
compatibility_date = "2026-11-25"
compatibility_flags = ["python_workers"]

[vars]
ENVIRONMENT = "development"
EXTRACTION_PROVIDER = "gemini"
GEMINI_MODEL = "gemini-2.5-flash"
MAX_UPLOAD_BYTES = "15728640"
ALLOWED_ORIGINS = "http://localhost:3000"
RATE_LIMIT_PER_MINUTE = "120"
SUPABASE_URL = "https://fqbsiybsuvfzwoxtjxsu.supabase.co"
SUPABASE_BUCKET = "invoiceline-documents"
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_cP8bm0jWniB1sCSwwMfiSA_TI3rL4GG"

[[d1_databases]]
binding = "DB"
database_name = "invoiceline-db-dev"
database_id = "REPLACE_WITH_DEV_D1_DATABASE_ID"
migrations_dir = "migrations"

[[queues.producers]]
binding = "INVOICE_QUEUE"
queue = "invoiceline-extraction-dev"

[[queues.consumers]]
queue = "invoiceline-extraction-dev"
max_batch_size = 5
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "invoiceline-extraction-dlq-dev"

[env.production]
name = "invoiceline-api-prod"

[env.production.vars]
ENVIRONMENT = "production"
EXTRACTION_PROVIDER = "gemini"
GEMINI_MODEL = "gemini-2.5-flash"
MAX_UPLOAD_BYTES = "15728640"
ALLOWED_ORIGINS = "https://invoiceline-web-prod.sakshyamniraula2.workers.dev"
RATE_LIMIT_PER_MINUTE = "120"
PUBLIC_BASE_URL = "https://invoiceline-api-prod.sakshyamniraula2.workers.dev"
SUPABASE_URL = "https://fqbsiybsuvfzwoxtjxsu.supabase.co"
SUPABASE_BUCKET = "invoiceline-documents"
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_cP8bm0jWniB1sCSwwMfiSA_TI3rL4GG"

[[env.production.d1_databases]]
binding = "DB"
database_name = "invoiceline-db-prod"
database_id = "9a522d71-cd14-44fe-a09c-b3a583862774"
migrations_dir = "migrations"

[[env.production.queues.producers]]
binding = "INVOICE_QUEUE"
queue = "invoiceline-extraction-prod"

[[env.production.queues.consumers]]
queue = "invoiceline-extraction-prod"
max_batch_size = 5
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "invoiceline-extraction-dlq-prod"
