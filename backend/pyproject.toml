[project]
name = "invoiceline-backend"
version = "0.1.0"
description = "InvoiceLine AI FastAPI backend for Cloudflare Python Workers"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
    "python-multipart>=0.0.12,<1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "uvicorn>=0.32.0",
    "ruff>=0.8.0",
    "workers-py",
    "workers-runtime-sdk",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
